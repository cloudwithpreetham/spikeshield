worker_processes auto;
worker_rlimit_nofile 65535;
events { worker_connections 4096; use epoll; multi_accept on; }
http {
    # Separate zones for checkout vs browsing
    limit_req_zone $binary_remote_addr zone=checkout_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=browse_limit:10m rate=200r/s;
    limit_conn_zone $binary_remote_addr zone=checkout_conn:10m;
    
    proxy_cache_path /tmp/nginx_catalog_cache levels=1:2 keys_zone=catalog_cache:10m max_size=500m inactive=30m;
    
    upstream spikeshield {
        server 127.0.0.1:8000;
        keepalive 64;
    }
    
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    
    server {
        listen 80;
        set_real_ip_from 10.0.0.0/8;
        real_ip_header X-Forwarded-For;
        
        # Checkout protection - strict rate limit to prevent inventory racing
        location /checkout {
            limit_req zone=checkout_limit burst=20 nodelay;
            limit_conn checkout_conn 5;
            proxy_pass http://spikeshield;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        
        # Product catalog - micro-cache 30s
        location /catalog {
            limit_req zone=browse_limit burst=500 nodelay;
            proxy_cache catalog_cache;
            proxy_cache_valid 200 30s;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;
            proxy_pass http://spikeshield;
            proxy_http_version 1.1;
        }
        
        location / {
            limit_req zone=browse_limit burst=200 nodelay;
            proxy_pass http://spikeshield;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        
        location /health { proxy_pass http://spikeshield; access_log off; }
    }
}
