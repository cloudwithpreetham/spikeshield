# Worker settings
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # Upstream with keepalive for UPI callbacks
    upstream spikeshield {
        server 127.0.0.1:8000;
        keepalive 128;
        keepalive_requests 1000;
        keepalive_timeout 65s;
    }
    
    # No gzip on webhook paths (already binary/JSON, minimal gain)
    gzip off;
    
    server {
        listen 80;
        
        # Real IP from ALB
        set_real_ip_from 10.0.0.0/8;
        real_ip_header X-Forwarded-For;
        
        # UPI webhook endpoints - higher limit
        location /webhook {
            limit_req zone=webhook_limit burst=500 nodelay;
            limit_conn conn_limit 200;
            proxy_pass http://spikeshield;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
        
        # General API
        location / {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://spikeshield;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # Health check - no rate limiting
        location /health {
            proxy_pass http://spikeshield;
            proxy_http_version 1.1;
            access_log off;
        }
    }
}
