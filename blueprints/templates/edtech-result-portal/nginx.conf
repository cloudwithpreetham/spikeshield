worker_processes auto;
worker_rlimit_nofile 65535;
events { worker_connections 4096; use epoll; multi_accept on; }
http {
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=result_cache:10m max_size=1g inactive=60m;
    limit_req_zone $binary_remote_addr zone=result_limit:10m rate=500r/s;
    
    upstream spikeshield {
        server 127.0.0.1:8000;
        keepalive 64;
    }
    
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_comp_level 6;
    
    server {
        listen 80;
        set_real_ip_from 10.0.0.0/8;
        real_ip_header X-Forwarded-For;
        
        # Result pages - micro-cache 30s (absorbs exam result stampede)
        location /results {
            limit_req zone=result_limit burst=1000 nodelay;
            proxy_cache result_cache;
            proxy_cache_valid 200 30s;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;
            proxy_pass http://spikeshield;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        
        # File uploads (admit cards)
        client_max_body_size 10m;
        
        location / {
            limit_req zone=result_limit burst=200 nodelay;
            proxy_pass http://spikeshield;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
        
        location /health { proxy_pass http://spikeshield; access_log off; }
    }
}
